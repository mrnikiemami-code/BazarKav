name: Architecture guards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check architecture structure
        run: python tools/architecture/check_architecture.py
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore BazarKav.sln --locked-mode
      - name: Build
        run: dotnet build BazarKav.sln -c Release --no-restore
      - name: Test
        run: dotnet test BazarKav.sln -c Release --no-build --no-restore
