name: Architecture guards
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bazarkav_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bazarkav-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bazarkav_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BAZARKAV_TEST_POSTGRES: Host=localhost;Port=5432;Database=bazarkav_test;Username=postgres;Password=bazarkav-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check architecture structure
        run: python tools/architecture/check_architecture.py
      - name: Verify request and mapping guard regressions
        run: python tools/architecture/test_architecture_guard.py
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore BazarKav.sln --locked-mode
      - name: Build
        run: dotnet build BazarKav.sln -c Release --no-restore
      - name: Test
        run: dotnet test BazarKav.sln -c Release --no-build --no-restore
